# Docker entrypoint (the `web` service). Production TLS notes are in docs/DEPLOYMENT.md.
#
# Upstreams are looked up through Docker's DNS (127.0.0.11) on each request instead of once at start-up.
# Rebuilding gives the backend/frontend containers new IP addresses; with a fixed `proxy_pass http://backend:8000`
# nginx kept sending /api/ and /admin/ to the old address after a deploy → 502 Bad Gateway, sign-in and
# "Add to bag" failed ("Unable to start a secure session") until the web container was restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTPS is handled by the server's outer nginx/proxy, which talks to this container over plain HTTP.
# Pass on the scheme it reports (https) so Django doesn't redirect https → https forever
# (ERR_TOO_MANY_REDIRECTS); fall back to this connection's scheme when no outer proxy sets it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;   # several photos of up to 10 MB each in one admin save
    client_body_timeout 300s;
    add_header X-Content-Type-Options nosniff always;

    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:3000;

    location /media/ { alias /srv/media/; expires 7d; }
    location /static/ { alias /srv/static/; expires 1y; }

    location ~ ^/(api|admin|accounts)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}

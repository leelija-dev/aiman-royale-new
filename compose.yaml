name: aiman-royale-new
x-backend: &backend
  build: ./backend
  env_file: .env
  volumes:
    - media:/app/media
    - static:/app/staticfiles
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    <<: *backend
    # On every start: apply database migrations, refresh the shared static volume (it keeps old files
    # after a rebuild otherwise), then start the web server. Worker/beat start after it is healthy.
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 45 --access-logfile -"
  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=2
  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        MEDIA_CDN_DOMAIN: ${MEDIA_CDN_DOMAIN:-}
    env_file: .env
    depends_on: [backend]
    restart: unless-stopped
  web:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on: [backend, frontend]
    restart: unless-stopped
volumes:
  postgres:
  redis:
  media:
  static:
